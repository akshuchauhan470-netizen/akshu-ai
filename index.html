<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akshu AI
</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0b0f;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */

.header {
    height: 65px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    background: #111116;
    border-bottom: 1px solid #292933;
}

.menu-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 23px;
    cursor: pointer;
}

.logo {
    flex: 1;
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #7c5cff;
}

select {
    background: #1b1b22;
    color: white;
    border: 1px solid #33333d;
    border-radius: 9px;
    padding: 9px;
    outline: none;
}

.model-select {
    max-width: 140px;
}

.voice-select {
    max-width: 160px;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100vh;
    padding: 20px;
    background: #111116;
    border-right: 1px solid #292933;
    z-index: 1000;
    transition: 0.25s;
}

.sidebar.open {
    left: 0;
}

.sidebar-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.sidebar-title span {
    color: #7c5cff;
}

.close-btn {
    float: right;
    background: transparent;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #363640;
    background: #1d1d25;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.sidebar-info {
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid #292933;
}

.sidebar-info p {
    margin-bottom: 7px;
}

.sidebar-info small {
    color: #9999a5;
}

/* CHAT */

.chat {
    height: calc(100vh - 65px);
    overflow-y: auto;
    padding: 25px 15px 110px;
}

.welcome {
    max-width: 700px;
    margin: 100px auto;
    text-align: center;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: #7c5cff;
}

.welcome p {
    color: #9999a5;
}

/* MESSAGE */

.message {
    max-width: 750px;
    margin: 15px auto;
    padding: 14px 16px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user {
    background: #202027;
}

.ai {
    background: #15151b;
    border: 1px solid #292933;
}

/* INPUT */

.input-area {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px;
    background: linear-gradient(
        transparent,
        #0b0b0f 25%
    );
}

.input-box {
    max-width: 750px;
    margin: auto;
    display: flex;
    gap: 8px;
    padding: 8px;
    background: #19191f;
    border: 1px solid #30303a;
    border-radius: 15px;
}

#messageInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 10px;
}

#sendBtn,
#voiceBtn,
#stopBtn {
    min-width: 45px;
    height: 45px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#sendBtn {
    background: #7c5cff;
}

#sendBtn:disabled {
    opacity: 0.5;
}

#voiceBtn {
    background: #29293a;
}

#voiceBtn.listening {
    background: #7c5cff;
}

#stopBtn {
    display: none;
    background: #ff4d4d;
}

#stopBtn.active {
    display: block;
}

/* MOBILE */

@media(max-width:700px) {

    .header {
        gap: 5px;
        padding: 0 7px;
    }

    .logo {
        font-size: 17px;
    }

    .model-select,
    .voice-select {
        font-size: 10px;
        padding: 8px 5px;
    }

    .model-select {
        max-width: 90px;
    }

    .voice-select {
        max-width: 95px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .message {
        max-width: 95%;
    }

    #sendBtn,
    #voiceBtn,
    #stopBtn {
        min-width: 42px;
        width: 42px;
        height: 42px;
    }
}
</style>
</head>
<body>
  <!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <button class="close-btn" id="closeBtn">✕</button>

<div class="sidebar-title">
    <span>Akshu
    </span> AI
</div>

<button class="new-chat" id="newChatBtn">
    ＋ New Chat
</button>

<div class="sidebar-info">
    <p>🤖 AI Models</p>
    <small>Models are loaded from OpenRouter.</small>
</div>

<div class="sidebar-info">
    <p>🔊 Voices</p>
    <small>Voices available on your device.
    </small>
</div>

<div class="sidebar-info">
    <p>💬 Chat History</p>
    <small>Your chats are saved on this device.</small>
</div>

</aside><!-- HEADER -->
<header class="header">
  <button class="menu-btn" id="menuBtn">
    ☰
</button>

<div class="logo">
    <span>Akshu</span> AI
</div>

<select class="model-select" id="modelSelect">
    <option value="openrouter/free">
        Free AI
    </option>
</select>

<select class="voice-select" id="voiceSelect">
    <option value="">
        Default Voice
    </option>
</select>

</header><!-- CHAT -->
<main class="chat" id="chat">
  <div class="welcome" id="welcome">

    <h1>
        Welcome to <span>Akshu AI</span>
    </h1>

    <p>
        Ask anything and get an AI-powered answer.
    </p>

</div>

</main>
<!-- INPUT -->
<div class="input-area">
  <div class="input-box">

    <input
        id="messageInput"
        type="text"
        placeholder="Message Akshu AI..."
        autocomplete="off"
    >

    <button id="sendBtn" type="button">
        ➤
    </button>

    <button id="voiceBtn" type="button">
        🎙️
    </button>

    <button id="stopBtn" type="button">
        ■
    </button>

</div>

</div>
<script>

/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const voiceBtn =
    document.getElementById("voiceBtn");

const stopBtn =
    document.getElementById("stopBtn");

const chat =
    document.getElementById("chat");

const modelSelect =
    document.getElementById("modelSelect");

const voiceSelect =
    document.getElementById("voiceSelect");

const sidebar =
    document.getElementById("sidebar");

const menuBtn =
    document.getElementById("menuBtn");

const closeBtn =
    document.getElementById("closeBtn");

const newChatBtn =
    document.getElementById("newChatBtn");

let stopTyping = false;
let availableVoices = [];


/* =========================
   SPEECH INPUT
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    voiceBtn.onclick = () => {

        try {

            recognition.start();

            voiceBtn.classList.add(
                "listening"
            );

        } catch (error) {

            console.log(error);

        }

    };

    recognition.onresult = (event) => {

        input.value =
            event.results[0][0].transcript;

        voiceBtn.classList.remove(
            "listening"
        );

    };

    recognition.onerror = () => {

        voiceBtn.classList.remove(
            "listening"
        );

    };

    recognition.onend = () => {

        voiceBtn.classList.remove(
            "listening"
        );

    };

} else {

    voiceBtn.disabled = true;
    voiceBtn.textContent = "❌";

}


/* =========================
   LOAD VOICES
========================= */

function loadVoices() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    availableVoices =
        window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Default Voice";

    voiceSelect.appendChild(
        defaultOption
    );

    availableVoices.forEach(
        (voice, index) => {

            const option =
                document.createElement("option");

            option.value = index;

            option.textContent =
                voice.name +
                " (" +
                voice.lang +
                ")";

            voiceSelect.appendChild(
                option
            );

        }
    );
}

loadVoices();

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* =========================
   SIDEBAR
========================= */

menuBtn.onclick = () => {

    sidebar.classList.add("open");

};

closeBtn.onclick = () => {

    sidebar.classList.remove("open");

};


/* =========================
   NEW CHAT
========================= */

newChatBtn.onclick = () => {

    chat.innerHTML = `
        <div class="welcome" id="welcome">

            <h1>
                Welcome to <span>Akshu AI</span>
            </h1>

            <p>
                Ask anything and get an AI-powered answer.
            </p>

        </div>
    `;

    localStorage.removeItem(
        "akshuChat"
    );

    stopTyping = true;

    stopBtn.classList.remove(
        "active"
    );

    sendBtn.disabled = false;

    sidebar.classList.remove(
        "open"
    );

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

};


/* =========================
   CLEAN TEXT FOR VOICE
========================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /[*_#`~]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================
   AI VOICE
========================= */

function speakText(text) {

    if (
        !("speechSynthesis" in window) ||
        !("SpeechSynthesisUtterance" in window)
    ) {
        return;
    }

    const speechText =
        cleanTextForSpeech(text);

    if (!speechText) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            speechText
        );

    speech.rate = 1;
    speech.pitch = 1;

    const selectedIndex =
        voiceSelect.value;

    if (selectedIndex !== "") {

        const selectedVoice =
            availableVoices[
                Number(selectedIndex)
            ];

        if (selectedVoice) {

            speech.voice =
                selectedVoice;

            speech.lang =
                selectedVoice.lang;

        }

    } else {

        speech.lang = "hi-IN";

    }

    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    if (sendBtn.disabled) {
        return;
    }

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.style.display = "none";
    }


    /* USER MESSAGE */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(
        userMessage
    );

    input.value = "";

    sendBtn.disabled = true;

    stopTyping = false;

    stopBtn.classList.add(
        "active"
    );


    /* HISTORY */

    let history =
        JSON.parse(
            localStorage.getItem(
                "akshuChat"
            )
        ) || [];


    history.push({

        role: "user",
        content: text

    });


    localStorage.setItem(
        "akshuChat",
        JSON.stringify(history)
    );


    /* AI MESSAGE */

    const aiMessage =
        document.createElement("div");

    aiMessage.className =
        "message ai";

    aiMessage.textContent =
        "Thinking...";

    chat.appendChild(
        aiMessage
    );

    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch(
                "https://akshu-ai.onrender.com/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: text,

                        model:
                            modelSelect.value

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed"
            );

        }


        const reply =
            data.reply ||
            "No response received.";


        /* VOICE */

        speakText(reply);


        /* TYPING */

        aiMessage.textContent = "";

        for (
            let i = 0;
            i < reply.length;
            i++
        ) {

            if (stopTyping) {
                break;
            }

            aiMessage.textContent +=
                reply[i];

            chat.scrollTop =
                chat.scrollHeight;

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        15
                    )
            );

        }


        /* SAVE AI */

        history.push({

            role: "assistant",

            content:
                aiMessage.textContent

        });

        localStorage.setItem(
            "akshuChat",
            JSON.stringify(history)
        );


    } catch (error) {

        console.error(
            "AI Error:",
            error
        );

        if (!stopTyping) {

            aiMessage.textContent =
                "❌ AI connection failed.";

        }

    }


    sendBtn.disabled = false;

    stopBtn.classList.remove(
        "active"
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   STOP BUTTON
========================= */

stopBtn.onclick = () => {

    stopTyping = true;

    stopBtn.classList.remove(
        "active"
    );

    sendBtn.disabled = false;

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

    }

};


/* =========================
   SEND BUTTON
========================= */

sendBtn.onclick =
    sendMessage;


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   LOAD MODELS
========================= */

async function loadModels() {

    try {

        const response =
            await fetch(
                "https://akshu-ai.onrender.com/api/models"
            );

        if (!response.ok) {
            throw new Error(
                "Models request failed"
            );
        }

        const models =
            await response.json();

        if (
            !Array.isArray(models) ||
            models.length === 0
        ) {
            return;
        }

        modelSelect.innerHTML = "";

        models.forEach(
            (model) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    model.id;

                option.textContent =
                    model.name;

                modelSelect.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.log(
            "Could not load models:",
            error
        );

    }

}


/* =========================
   LOAD CHAT HISTORY
========================= */

function loadHistory() {

    const history =
        JSON.parse(
            localStorage.getItem(
                "akshuChat"
            )
        ) || [];

    if (history.length === 0) {
        return;
    }

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.style.display =
            "none";
    }

    history.forEach(
        (item) => {

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                item.role === "user"
                    ? "message user"
                    : "message ai";

            message.textContent =
                item.content;

            chat.appendChild(
                message
            );

        }
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   START
========================= */

loadModels();

loadHistory();

</script>
</body>
    </html>
